services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linghsiang-web
    ports:
      - "443:443"
    volumes:
      - ./certs:/app/certs
      # 站台資料目錄（Menu.xlsx + Pic/：hero / logo / 產品照 / QRCode）。
      # ./data 已加入 .gitignore，與 git 管的程式碼完全分離：
      # git pull、docker compose up --build 都不會動到正式資料。
      # 首次啟動時容器內 EnsureSeeded 會自動建立初始 Menu.xlsx 並複製內建 Logo / Hero 圖。
      - ./data:/app/data
    environment:
      - CERT_PASSWORD=${CERT_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Production
      # 資料檔根目錄：指到上面掛載的 data 目錄
      - DataRoot=/app/data
    restart: unless-stopped
